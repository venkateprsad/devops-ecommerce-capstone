<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Ecommerce Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            margin: 0;
        }
        header {
            background: #232f3e;
            color: white;
            padding: 25px;
        }
        .product {
            background: white;
            margin: 30px auto;
            padding: 25px;
            max-width: 350px;
            border-radius: 10px;
        }
        button {
            background: #ff9900;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>DevOps Ecommerce Store</h1>
        <p>Welcome to our online shopping website!</p>
    </header>

    <div class="product">
        <h2>Wireless Headphones</h2>
        <p>Price: ₹1,499</p>
        <button>Buy Now</button>
    </div>

    <footer>
        <p>Powered by Docker, Nginx and Jenkins</p>
    </footer>
</body>
</html>
