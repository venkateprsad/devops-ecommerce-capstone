
<!DOCTYPE html>
<html>
<head>
    <title>DevOps E-Commerce</title>
    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }
        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        li {
            margin: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>DevOps E-Commerce Store</h1>
    <h2>Available Products</h2>
    <ul id="products"></ul>
    <p id="status">Loading...</p>
</div>

<script>
async function loadProducts() {
    try {
        const response = await fetch('/api/products');
        const products = await response.json();

        document.getElementById('products').innerHTML =
            products.map(p =>
                `<li>${p.name} - ₹${p.price}</li>`
            ).join('');

        document.getElementById('status').innerText =
            'Product service connected successfully';
    } catch (error) {
        document.getElementById('status').innerText =
            'Unable to connect to product service';
    }
}

loadProducts();
</script>
</body>
</html>
