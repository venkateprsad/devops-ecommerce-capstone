
services:

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "80:80"
    depends_on:
      - product-service

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5001:5001"

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "5002:5002"
